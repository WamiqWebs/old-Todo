<!DOCTYPE html>
<html>
<head>
  <title>Todo List with Checkbox</title>
  <style>
    body{
      margin: 20;
      padding: 0;
      background-color: gray;
      display: flex;
      justify-content: center;
    }
    .main{
        height: auto;
        width: 420px;
        overflow-y: auto;
        overflow-x: auto;
        background-color: royalblue;
        padding: 20px;
    }
    #container{
      display: flex;
     flex-direction: column;
}
    .done{
        background-color:  #0A0033;
        color: whitesmoke;
        text-decoration: underline;
        transition:2s;
        text-align: center;
    }
    .d1{
        background-color: fuchsia;
        color: whitesmoke;
        gap: 5px;
        margin-top: 15px;
        display: flex;       
        align-items: center;
        padding: 7px;  
        width: 100%;
        box-sizing: border-box;
    }
    .para{
      flex: 1;
      margin: 0;
    }
    .check{
      margin-left: 30px;
      margin-top: 0;
    }
  </style>
</head>
<body>

  <div class="main">
      <input id="inp" type="text" placeholder="Type something...">
      <button onclick="show()">Add</button>
      <div id="container"></div>
  </div> 
  <script>
   let count = 0;
   function show(){
    let input  = document.getElementById("inp").value;
     if(input === ""){
        return false;
      }
      let div = document.createElement("div");
      div.className = "d1";

      count ++;
        let checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "check"

      let para = document.createElement("p");
      para.className = "para";
      para.textContent = count + ": " + input;

    checkbox.addEventListener("click",function(){
        if(this.checked){
      para.classList.add('done');
      setTimeout(() => {
        div.remove();
      }, 2000);
        }
    })
    div.append(para);
    div.append(checkbox);
    document.getElementById("container").appendChild(div);
    document.getElementById("inp").value = "";
   }
  </script>

</body>
</html>
